<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="10"/>
  <g transform="translate(100, 100)">
    <!-- Metal tin box -->
    <rect x="-65" y="-75" width="130" height="150" fill="#cbd5e1" stroke="#64748b" stroke-width="3" rx="8"/>
    <rect x="-55" y="-65" width="110" height="130" fill="#334155" rx="5"/>
    <!-- Drafting compass inside -->
    <circle cx="0" cy="-40" r="10" fill="#94a3b8"/>
    <line x1="-3" y1="-30" x2="-25" y2="40" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="-30" x2="25" y2="40" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-40" r="4" fill="#38bdf8"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#fbbf24" stroke-width="2"/>
  </g>
</svg>