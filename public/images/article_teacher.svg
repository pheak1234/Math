<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="teacherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#teacherBg)" rx="8"/>
  <!-- Whiteboard -->
  <rect x="20" y="20" width="260" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" rx="4"/>
  <!-- Formulas on whiteboard -->
  <text x="40" y="60" font-family="serif" font-style="italic" font-size="16" fill="#1e293b">y = ax² + bx + c</text>
  <text x="40" y="90" font-family="serif" font-style="italic" font-size="14" fill="#0284c7">Δ = b² - 4ac &gt; 0</text>
  <path d="M40,140 Q80,100 120,140" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- Teacher silhouette drawing -->
  <g transform="translate(210, 110)">
    <circle cx="0" cy="-35" r="22" fill="#0f172a"/>
    <path d="M-30,45 C-30,0 -15,-10 0,-10 C15,-10 30,0 30,45 Z" fill="#1e293b"/>
    <line x1="-15" y1="5" x2="-55" y2="-20" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-55" cy="-20" r="5" fill="#f87171"/>
  </g>
</svg>