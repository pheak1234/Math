<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="60%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="polyFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="polyFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="polyFace3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bgDarkGreen)" rx="8"/>
  <rect x="0" y="25" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="8" y="38" font-family="sans-serif" font-weight="700" font-size="9" fill="#ffffff">REVISED EDITION</text>
  <text x="150" y="80" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">MATHS</text>
  <text x="150" y="105" font-family="sans-serif" font-weight="500" font-size="12" fill="#86efac" text-anchor="middle">SOLID GEOMETRY &amp; VECTORS</text>
  
  <!-- 3D Polyhedron / Diamond crystal -->
  <g transform="translate(150, 230)">
    <polygon points="0,-90 -85,-10 0,60" fill="url(#polyFace1)" opacity="0.95"/>
    <polygon points="0,-90 85,-10 0,60" fill="url(#polyFace2)" opacity="0.9"/>
    <polygon points="0,60 -85,-10 0,95" fill="url(#polyFace3)" opacity="0.85"/>
    <polygon points="0,60 85,-10 0,95" fill="#14532d" opacity="0.95"/>
    <polygon points="0,-90 0,60 -30,0" fill="#86efac" opacity="0.35"/>
    <!-- Wireframe grid lines -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#22c55e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#86efac" stroke-dasharray="2,3" stroke-width="1.2" opacity="0.4"/>
  </g>
  <text x="150" y="375" font-family="sans-serif" font-weight="600" font-size="11" fill="#86efac" text-anchor="middle">ADVANCED LEVEL</text>
</svg>