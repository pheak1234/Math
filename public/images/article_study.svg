<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f8fafc" rx="8"/>
  <!-- Wooden table top -->
  <rect x="10" y="10" width="280" height="180" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" rx="6"/>
  <!-- Open notebook -->
  <rect x="40" y="40" width="120" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="4"/>
  <line x1="100" y1="40" x2="100" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="60" x2="90" y2="60" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="50" y1="75" x2="90" y2="75" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="50" y1="90" x2="80" y2="90" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Scientific calculator -->
  <rect x="180" y="45" width="70" height="105" fill="#1e293b" rx="6"/>
  <rect x="190" y="55" width="50" height="22" fill="#86efac" rx="2"/>
  <text x="235" y="71" font-family="monospace" font-weight="700" font-size="12" fill="#065f46" text-anchor="end">3.14159</text>
  <!-- Buttons -->
  <g fill="#475569">
    <rect x="190" y="85" width="10" height="8" rx="1"/>
    <rect x="205" y="85" width="10" height="8" rx="1"/>
    <rect x="220" y="85" width="10" height="8" rx="1"/>
    <rect x="190" y="98" width="10" height="8" rx="1"/>
    <rect x="205" y="98" width="10" height="8" rx="1"/>
    <rect x="220" y="98" width="10" height="8" rx="1"/>
    <rect x="190" y="111" width="10" height="8" rx="1"/>
    <rect x="205" y="111" width="10" height="8" rx="1"/>
    <rect x="220" y="111" width="10" height="8" rx="1"/>
    <rect x="235" y="85" width="10" height="34" fill="#0284c7" rx="1"/>
  </g>
</svg>