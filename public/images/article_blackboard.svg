<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#1e293b" rx="8"/>
  <rect x="6" y="6" width="288" height="188" fill="none" stroke="#64748b" stroke-width="2" rx="6"/>
  <!-- Complex chalk formulas -->
  <g fill="#f8fafc" opacity="0.9" font-family="serif" font-style="italic">
    <text x="25" y="45" font-size="16">∫ √(1 - x²) dx = ½(x√(1-x²) + arcsin x)</text>
    <text x="25" y="80" font-size="14">lim (x→0) [sin(x)/x] = 1</text>
    <text x="25" y="115" font-size="15">∇ × B = μ₀J + μ₀ε₀(∂E/∂t)</text>
    <text x="25" y="150" font-size="14">∑ (1/n²) = π² / 6</text>
  </g>
  <!-- Geometry circle & tangent chalk diagram -->
  <circle cx="230" cy="120" r="35" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="190" y1="85" x2="270" y2="155" stroke="#f43f5e" stroke-width="2"/>
  <line x1="230" y1="120" x2="230" y2="85" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3,3"/>
